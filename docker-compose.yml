services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: adw-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adw}
      POSTGRES_USER: ${POSTGRES_USER:-adw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - adw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adw} -d ${POSTGRES_DB:-adw}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adw_pgdata:
